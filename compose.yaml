# Production-style stack: `docker compose up -d`, then open http://127.0.0.1:8000.
# Credentials come from `.env` (copy `.env.example`).
#
# Per ADR 0001 the app has no login, so it is published on 127.0.0.1 only
# (expose it to the tailnet with `tailscale serve`), and Postgres is not
# published on the host at all.

services:
  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Nightly pg_dump (custom format) into ./backups, keeping the newest BACKUP_KEEP.
  # On demand: `docker compose exec backup /backup/backup.sh`. See README "Backups".
  backup:
    image: postgres:17.7-alpine
    restart: unless-stopped
    # Run as the host user so dumps in ./backups are owned by you, not root.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/backup/schedule.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
